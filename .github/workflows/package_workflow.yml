name: Python Package
on:
    workflow_run:
        workflows: ["Tests"]
        branches: [main]
        types:
            - completed
# Build, publish and tag the commit whose Tests run passed. On workflow_run, the default
# checkout is the newest commit on main instead, which may have been pushed after the tested
# commit and not been tested yet. Only a successful Tests run for a push to this repository's
# main publishes: the `branches` filter alone matches any head branch named main, e.g. a
# fork's, should Tests ever run for pull requests.
jobs:
    build_package:
        runs-on: ubuntu-latest
        if: >-
            ${{ github.event.workflow_run.conclusion == 'success'
            && github.event.workflow_run.event == 'push'
            && github.event.workflow_run.head_repository.full_name == github.repository }}
        steps:
            - uses: actions/checkout@v7
              with:
                ref: ${{ github.event.workflow_run.head_sha }}
            - uses: ./.github/actions/build
    publish_package:
        needs: build_package
        runs-on: ubuntu-latest
        if: >-
            ${{ github.event.workflow_run.conclusion == 'success'
            && github.event.workflow_run.event == 'push'
            && github.event.workflow_run.head_repository.full_name == github.repository }}
        environment:
            name: pypi
            url: https://pypi.org/p/ikpls
        permissions:
            id-token: write
        steps:  
            - uses: actions/checkout@v7
              with:
                ref: ${{ github.event.workflow_run.head_sha }}
            - uses: actions/download-artifact@v8
              with:
                name: python-package-distributions
                path: dist/
            - uses: pypa/gh-action-pypi-publish@release/v1
              with:
                # Don't fail if this version is already on PyPI (e.g. when the
                # package workflow is re-run after a successful publish).
                skip-existing: true
    github_release:
        needs: publish_package
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v7
              with:
                ref: ${{ github.event.workflow_run.head_sha }}
            - uses: ./.github/actions/release

